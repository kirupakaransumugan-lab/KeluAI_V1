# KELU production, all on one AWS EC2 server: the website and HTTPS (Caddy), backend, MySQL 8
# and Qdrant. Files live in S3 and embeddings come from Bedrock, so nothing here needs a big
# disk or much RAM.
#
# On the server, from the repo root (see docs/deployment.md):
#   docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml up -d --build
#
# infra/.env.prod holds every secret. You create it on the server; it is never committed.
services:
  web:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"     # HTTP/3
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in infra/.env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [backend]
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile
    env_file: .env.prod
    environment:
      # Service names on the private Docker network; nothing below is reachable from the internet.
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      VECTOR_DB_URL: http://qdrant:6333
      EMBEDDING_PROVIDER: bedrock
      STORAGE_BACKEND: s3
      COOKIE_SECURE: "true"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:?set DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER:?set DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci",
              "--innodb-buffer-pool-size=256M", "--performance-schema=OFF"]   # fits a 2 GB server
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      retries: 12
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0      # within one minor version of qdrant-client (requirements-server.txt)
    environment:
      QDRANT__SERVICE__API_KEY: ${VECTOR_DB_API_KEY:?set VECTOR_DB_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  caddy_data:
  mysql_data:
  qdrant_data:
