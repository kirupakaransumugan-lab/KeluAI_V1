[project]
name = "kelu-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pymysql>=1.1",
  "cryptography>=42",          # required by PyMySQL for MySQL 8 caching_sha2_password
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "tzdata>=2024.1",            # IANA time zones for zoneinfo on Windows (Asia/Colombo)
  # RAG tutor: Qdrant vector DB, OpenRouter over HTTP, local BGE-M3 embeddings (~2.5 GB model on first run)
  "qdrant-client>=1.12",
  "httpx>=0.27",
  "sentence-transformers>=3.0",
  # OCR of scanned papers: render PDF pages to images for the vision model (app/rag/ocr.py)
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
